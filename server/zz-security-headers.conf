# SINO FRESH — security response headers, applied at the ORIGIN.
#
# Installed as /etc/httpd/conf.d/zz-security-headers.conf on 65.49.215.152.
# This machine serves both dev.zxpet.com and the production site (/var/www/html),
# so one file covers both, which is the point: the origin answers on its bare IP
# with a Host header (verified 2026-09-24), so anything added only at Cloudflare
# can be walked around.
#
# Reload after editing:  httpd -t && systemctl reload httpd
#
# Rollback:              rm /etc/httpd/conf.d/zz-security-headers.conf
#
<IfModule mod_headers.c>

    # --- HSTS -------------------------------------------------------------
    # No includeSubDomains yet: first confirm no subdomain still answers plain
    # HTTP. No preload either, since preload is effectively irreversible.
    Header always set Strict-Transport-Security "max-age=31536000" env=HTTPS

    # --- MIME sniffing ----------------------------------------------------
    # setifempty, because the WP REST controller already sends its own nosniff
    # on /wp-json/*; without it those responses would carry the header twice.
    Header always setifempty X-Content-Type-Options "nosniff"

    # --- Clickjacking -----------------------------------------------------
    Header always set X-Frame-Options "SAMEORIGIN"

    # --- Referrer leakage -------------------------------------------------
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # --- Feature access ---------------------------------------------------
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()"

    # --- CSP, report-only -------------------------------------------------
    # Report-Only on purpose: the theme, TranslatePress and Gravity Forms all
    # emit inline script/style, so enforcing this today would blank the page.
    # Report-only costs nothing and collects the violations needed to tighten
    # it later. No report-uri is set, so violations appear in the browser
    # console only.
    Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; frame-src https://www.youtube-nocookie.com; connect-src 'self' https://cloudflareinsights.com; base-uri 'self'; form-action 'self'; object-src 'none'"

</IfModule>
