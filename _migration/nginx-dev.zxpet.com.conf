# SINO FRESH dev 站 nginx server 块模板
# 用法：cp nginx-dev.zxpet.com.conf /etc/nginx/conf.d/dev.zxpet.com.conf
#       改好证书路径后 nginx -t && systemctl reload nginx
# 注：本站无 .htaccess 需求（nginx 环境与 Local 一致）

server {
    listen 80;
    server_name dev.zxpet.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dev.zxpet.com;

    root /var/www/dev.zxpet.com/public;
    index index.php index.html;

    # Cloudflare Origin Certificate（在 CF 后台生成，15年有效期）
    ssl_certificate     /etc/nginx/ssl/dev.zxpet.com.pem;
    ssl_certificate_key /etc/nginx/ssl/dev.zxpet.com.key;

    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # 按服务器实际 sock 路径调整：
        fastcgi_pass unix:/run/php-fpm/www.sock;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /xmlrpc.php { deny all; }
    location ~ /\. { deny all; }
}
